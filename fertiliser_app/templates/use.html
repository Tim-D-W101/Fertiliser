{% extends "base.html" %}
{% block title %}Use bags - {{ site_name }}{% endblock %}
{% block content %}
<h1>Record bags used</h1>
{% if not ferts %}
  <p class="empty">No fertilisers set up yet &ndash; ask the manager.</p>
{% else %}
<form method="post" class="stack">
  {% include "_pick.html" %}
  <label>Number of bags used</label>
  <div class="stepper">
    <button type="button" data-step="-1">&minus;</button>
    <input type="number" name="bags" id="bags" min="0.25" step="0.25" inputmode="decimal" required value="{{ form.get('bags', '1') }}">
    <button type="button" data-step="1">+</button>
  </div>
  {% include "_name.html" %}
  <label>Note (optional)
    <input name="note" value="{{ form.get('note', '') }}" placeholder="e.g. mix for tunnel 3">
  </label>
  <button class="btn big">Save</button>
</form>
<script>
document.querySelectorAll('.stepper button').forEach(function (b) {
  b.addEventListener('click', function () {
    var i = document.getElementById('bags');
    var v = (parseFloat(i.value) || 0) + parseFloat(b.dataset.step);
    i.value = Math.max(1, v);
  });
});
</script>
{% endif %}
{% endblock %}
