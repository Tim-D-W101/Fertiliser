{% extends "base.html" %}
{% block title %}{{ fert.name }} - {{ site_name }}{% endblock %}
{% block content %}
<h1>Edit {{ fert.name }}</h1>
<form method="post" class="stack narrow">
  <label>Name <input name="name" required value="{{ form['name'] }}"></label>
  <label>Kg per bag <input type="number" name="kg_per_bag" min="0.01" step="0.01" inputmode="decimal" required value="{{ form['kg_per_bag'] }}"></label>
  <label>Cost per bag ({{ currency }}) <input type="number" name="cost_per_bag" min="0" step="0.01" inputmode="decimal" required value="{{ form['cost_per_bag'] }}"></label>
  <label>Re-order level (bags) <input type="number" name="reorder_level" min="0" step="1" inputmode="decimal" value="{{ form['reorder_level'] }}"></label>
  <label class="check"><input type="checkbox" name="active" value="1" {{ 'checked' if form['active'] }}> In use (untick to hide it from the lists; history is kept)</label>
  <button class="btn">Save</button>
</form>
<h2>Price history</h2>
<div class="table-wrap"><table>
  <thead><tr><th>From</th><th class="num">Cost/bag</th><th>Changed by</th></tr></thead>
  <tbody>{% for p in prices %}<tr><td>{{ p.changed_at }}</td><td class="num">{{ p.cost_per_bag|money }}</td><td>{{ p.changed_by }}</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock %}
