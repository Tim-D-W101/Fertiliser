{% extends "base.html" %}
{% block title %}Delivery - {{ site_name }}{% endblock %}
{% block content %}
<h1>Book in a delivery</h1>
{% if not ferts %}
  <p class="empty"><a href="{{ url_for('fertilisers') }}">Add a fertiliser</a> first.</p>
{% else %}
<form method="post" class="stack">
  {% include "_pick.html" %}
  <label>Bags delivered
    <input type="number" name="bags" min="0.25" step="0.25" inputmode="decimal" required value="{{ form.get('bags', '') }}">
  </label>
  <label>Cost per bag ({{ currency }})
    <input type="number" name="cost_per_bag" id="cost" min="0" step="0.01" inputmode="decimal" required value="{{ form.get('cost_per_bag', '') }}">
  </label>
  <label class="check"><input type="checkbox" name="update_price" value="1" {{ 'checked' if form.get('update_price') }}>
    Use this as the new price for this fertiliser</label>
  {% include "_name.html" %}
  <label>Note (optional)
    <input name="note" value="{{ form.get('note', '') }}" placeholder="e.g. supplier / invoice number">
  </label>
  <button class="btn big">Save delivery</button>
</form>
<script>
// Pre-fill the cost with the fertiliser's current price.
function fillCost(r) { var c = document.getElementById('cost'); if (r && !c.dataset.touched) c.value = r.dataset.cost; }
document.getElementById('cost').addEventListener('input', function () { this.dataset.touched = 1; });
document.querySelectorAll('input[name=fertiliser_id]').forEach(function (r) {
  r.addEventListener('change', function () { fillCost(r); });
});
if (!document.getElementById('cost').value) fillCost(document.querySelector('input[name=fertiliser_id]:checked'));
</script>
{% endif %}
{% endblock %}
