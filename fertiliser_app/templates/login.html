{% extends "base.html" %}
{% block title %}Manager - {{ site_name }}{% endblock %}
{% block content %}
<h1>Manager PIN</h1>
<form method="post" class="stack narrow">
  <input type="hidden" name="next" value="{{ next }}">
  <label>PIN <input type="password" name="pin" inputmode="numeric" autofocus required></label>
  <button class="btn big">Unlock</button>
</form>
{% endblock %}
